{% extends 'ui/layouts/base.html' %}

{% block content %}
<div
    x-data="templateCreator()"
    class="mx-auto max-w-5xl px-4 py-8 sm:px-6 lg:px-8"
>
    <div class="mb-6 flex items-center justify-between">
        <div>
            <a href="{% url 'templates_domain:template-list' %}"
               class="text-sm text-blue-600 hover:text-blue-700">
                ← Назад к списку шаблонов
            </a>

            <h1 class="mt-2 text-2xl font-semibold text-gray-900">
                Создание нового шаблона
            </h1>
        </div>
    </div>

    <form method="post" @submit="beforeSubmit">
        {% csrf_token %}

        <input
            type="hidden"
            name="data"
            x-model="serialized"
        >

        <div class="space-y-8">
            <!-- Блок 1: Основная информация -->
            <div class="rounded-xl border border-gray-200 bg-white shadow-sm">
                <div class="border-b border-gray-200 px-6 py-5">
                    <h2 class="text-lg font-semibold">Основная информация</h2>
                </div>
                <div class="grid grid-cols-2 gap-6 p-6">
                    <div>
                        <label class="mb-2 block text-sm font-medium">UID оборудования</label>
                        <input
                            x-model="template.equipment_uid"
                            required
                            placeholder="Например: EQ-001"
                            class="w-full rounded-lg border border-gray-300 px-3 py-2"
                        >
                    </div>

                    <div>
                        <label class="mb-2 block text-sm font-medium">Тип чек-листа</label>
                        <select
                            x-model="template.checklist_type"
                            class="w-full rounded-lg border border-gray-300 px-3 py-2"
                        >
                            <option value="INSPECTION">Осмотр (INSPECTION)</option>
                            <option value="ACCEPTANCE">Приёмка (ACCEPTANCE)</option>
                            <option value="HANDOVER">Сдача (HANDOVER)</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Блок 2: Поля шаблона -->
            <div class="rounded-xl border border-gray-200 bg-white shadow-sm">
                <div class="flex items-center justify-between border-b border-gray-200 px-6 py-5">
                    <h2 class="text-lg font-semibold">Поля анкеты</h2>
                    <button
                        type="button"
                        @click="addField"
                        class="rounded-lg border border-gray-300 px-3 py-2 text-sm hover:bg-gray-50"
                    >
                        + Добавить поле
                    </button>
                </div>

                <div class="divide-y divide-gray-200">
                    <template x-for="(field, index) in template.fields" :key="index">
                        <div class="space-y-4 p-6">
                            <div class="grid grid-cols-12 gap-4">
                                <div class="col-span-1">
                                    <label class="mb-2 block text-xs">#</label>
                                    <input
                                        type="number"
                                        x-model.number="field.order"
                                        class="w-full rounded-lg border border-gray-300 px-2 py-2"
                                    >
                                </div>
                                <div class="col-span-5">
                                    <label class="mb-2 block text-xs">Название</label>
                                    <input
                                        x-model="field.name"
                                        required
                                        class="w-full rounded-lg border border-gray-300 p


x-3 py-2"
                                    >
                                </div>
                                <div class="col-span-3">
                                    <label class="mb-2 block text-xs">Тип</label>
                                    <select
                                        x-model="field.field_type"
                                        class="w-full rounded-lg border border-gray-300 px-3 py-2"
                                    >
                                        <option value="STRING">Строка (STRING)</option>
                                        <option value="INTEGER">Число (INTEGER)</option>
                                        <option value="CHOICE">Выбор из списка (CHOICE)</option>
                                        <option value="CHECKBOX">Чекбокс (CHECKBOX)</option>
                                        <option value="AUTO">Авто (AUTO)</option>
                                    </select>
                                </div>
                                <div class="col-span-3 flex items-end justify-end">
                                    <button
                                        type="button"
                                        @click="removeField(index)"
                                        class="rounded-lg border border-red-300 px-3 py-2 text-red-600 hover:bg-red-50"
                                    >
                                        Удалить
                                    </button>
                                </div>
                            </div>

                            <!-- Варианты выбора для типа CHOICE -->
                            <template x-if="field.field_type === 'CHOICE'">
                                <div class="rounded-lg bg-gray-50 p-4">
                                    <div class="mb-3 flex items-center justify-between">
                                        <div class="font-medium text-sm">Варианты выбора</div>
                                        <button
                                            type="button"
                                            @click="addChoice(field)"
                                            class="rounded border px-2 py-1 text-sm bg-white hover:bg-gray-100"
                                        >
                                            + Вариант
                                        </button>
                                    </div>
                                    <template x-for="(choice, cIndex) in field.choices">
                                        <div class="mb-2 flex gap-2">
                                            <input
                                                x-model="choice.value"
                                                required
                                                placeholder="Текст варианта"
                                                class="flex-1 rounded border border-gray-300 px-3 py-2 text-sm"
                                            >
                                            <input
                                                type="number"
                                                x-model.number="choice.order"
                                                class="w-20 rounded border border-gray-300 px-3 py-2 text-sm"
                                            >
                                            <button
                                                type="button"
                                                @click="field.choices.splice(cIndex, 1)"
                                                class="rounded border border-red-300 bg-white px-3 text-red-600 hover:bg-red-50"
                                            >
                                                ×
                                            </button>
                                        </div>
                                    </template>
                                </div>


</template>
                        </div>
                    </template>
                    
                    <!-- Сообщение, если полей нет -->
                    <template x-if="template.fields.length === 0">
                        <div class="p-8 text-center text-sm text-gray-500">
                            Добавьте первое поле для анкеты.
                        </div>
                    </template>
                </div>
            </div>

            <!-- Блок 3: Кнопки сохранения -->
            <div class="flex justify-end gap-3">
                <a
                    href="{% url 'templates_domain:template-list' %}"
                    class="rounded-lg border border-gray-300 px-4 py-2 hover:bg-gray-50"
                >
                    Отмена
                </a>
                <button
                    type="submit"
                    class="rounded-lg bg-blue-600 px-5 py-2 font-medium text-white hover:bg-blue-700"
                >
                    Создать
                </button>
            </div>
        </div>
    </form>
</div>

<script>
function templateCreator() {
    return {
        // Инициализируем пустую структуру, готовую к заполнению
        template: {
            equipment_uid: '',
            checklist_type: 'INSPECTION',
            fields: []
        },
        serialized: '',

        addField() {
            this.template.fields.push({
                name: '',
                field_type: 'STRING',
                order: this.template.fields.length + 1,
                choices: [],
            });
        },

        removeField(index) {
            this.template.fields.splice(index, 1);
        },

        addChoice(field) {
            field.choices.push({
                value: '',
                order: field.choices.length + 1,
            });
        },

        beforeSubmit() {
            // Подготавливаем JSON для отправки на наш бэкенд
            this.serialized = JSON.stringify({
                equipment_uid: this.template.equipment_uid,
                checklist_type: this.template.checklist_type,
                fields: this.template.fields,
            });
        },
    };
}
</script>
{% endblock %}
