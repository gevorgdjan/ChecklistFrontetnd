<span class=" inline-flex items-center gap-1 px-3 py-1 rounded-full text-xs font-medium  {% if status == 'planned' %} bg-gray-100 text-gray-700  {% elif status == 'waiting' %} bg-yellow-100 text-yellow-800  {% elif status == 'in_progress' %} bg-blue-100 text-blue-700  {% elif status == 'completed' %} bg-green-100 text-green-700  {% elif status == 'cancelled' %} bg-red-100 text-red-700  {% elif status == 'submitted' %} bg-gray-100 text-gray-700  {% elif status == 'confirmed' %} bg-green-100 text-green-700  {% elif status == 'rejected' %} bg-red-100 text-red-700  {% else %} bg-gray-100 text-gray-700  {% endif %} ">
    {% if status == 'planned' %}
        ⚪
    {% elif status == 'waiting' %}
        🟡
    {% elif status == 'in_progress' %}
        🔵
    {% elif status == 'completed' %}
        🟢
    {% elif status == 'cancelled' %}
        🔴
    {% endif %}
    {{ status }}
</span>
