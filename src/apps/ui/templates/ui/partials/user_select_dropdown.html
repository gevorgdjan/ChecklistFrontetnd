<div id="assigned-to-dropdown-content" class="max-h-64 overflow-y-auto">
    {% for user in users %}
        <button type="button"
                class="w-full text-left px-4 py-3 hover:bg-gray-100 transition"
                onclick="selectAssignedTo(this, {{ user.id }}, '{{ user.name|escapejs }}')">{{ user.name }}</button>
    {% empty %}
        <div class="px-4 py-3 text-sm text-gray-500">Пользователь не найден</div>
    {% endfor %}
</div>
