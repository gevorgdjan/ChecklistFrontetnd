<div id="partner-dropdown-content" class="max-h-64 overflow-y-auto">
    {% for partner in partners %}
        <button type="button"
                class="w-full text-left px-4 py-3 hover:bg-gray-100 transition"
                onclick="selectPartner(this, '{{ partner.id }}', '{{ partner.name|escapejs }}')">
            {{ partner.name }}
        </button>
    {% empty %}
        <div class="px-4 py-3 text-sm text-gray-500">Клиент не найден</div>
    {% endfor %}
</div>
