<div x-data="fileUploader()" class="space-y-4">
    <input x-ref="input"
           type="file"
           name="files"
           multiple
           class="hidden"
           @change="addFiles($event)">
    <div @click="$refs.input.click()"
         class="border-2 border-dashed border-gray-300 rounded-2xl p-8 text-center cursor-pointer hover:border-blue-400 hover:bg-blue-50 transition">
        <div class="text-4xl mb-3">📎</div>
        <div class="font-medium">Добавить файлы</div>
        <div class="text-sm text-gray-500 mt-2">Нажмите или перетащите файлы</div>
    </div>
    <template x-if="files.length > 0">
        <div class="space-y-2">
            <template x-for="(file, index) in files" :key="index">
                <div class="flex items-center justify-between bg-gray-50 rounded-xl px-4 py-3 border">
                    <div class="flex items-center gap-3 min-w-0">
                        <div class="text-2xl">📄</div>
                        <div class="min-w-0">
                            <div class="font-medium truncate" x-text="file.name"></div>
                            <div class="text-sm text-gray-500" x-text="formatFileSize(file.size)"></div>
                        </div>
                    </div>
                    <button type="button"
                            @click="removeFile(index)"
                            class="text-red-500 hover:text-red-700 transition">✕</button>
                </div>
            </template>
        </div>
    </template>
</div>
