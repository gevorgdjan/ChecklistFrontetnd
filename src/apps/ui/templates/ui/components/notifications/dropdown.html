<div class="w-96 bg-white rounded-2xl shadow-2xl border overflow-hidden">
    <div class="px-5 py-4 border-b">
        <div class="flex items-center justify-between">
            <h3 class="font-semibold text-lg">Уведомления</h3>
            <span class="text-sm text-gray-400">{{ notifications|length }}</span>
        </div>
    </div>
    <div class="max-h-96 overflow-y-auto">
        {% for notification in notifications %}
            <div class="px-5 py-4 border-b hover:bg-gray-50 transition cursor-pointer">
                <div class="flex items-start justify-between gap-4">
                    <div>
                        <div class="font-medium">{{ notification.title }}</div>
                        <div class="text-sm text-gray-600 mt-1">{{ notification.message }}</div>
                    </div>
                    <div class="text-xs text-gray-400 whitespace-nowrap">{{ notification.time }}</div>
                </div>
            </div>
        {% empty %}
            <div class="p-8 text-center text-gray-500">Нет уведомлений</div>
        {% endfor %}
    </div>
    <div class="px-5 py-3 bg-gray-50">
        <button class="w-full text-sm text-blue-600 hover:text-blue-700 font-medium">Открыть все уведомления</button>
    </div>
</div>
