[tool.ruff]
line-length = 88
extend-exclude = [
    "**/migrations/**",
    "**/__pycache__/**",
    ".venv/",
    "venv/",
    ".pytest_cache/",
    ".mypy_cache/",
    ".ruff_cache/",
    "node_modules/",
    "static/",
    "media/",
]

[tool.ruff.lint]
ignore = ["E501"]
select = [
    "E", # pycodestyle
    "F", # Pyflakes
    "UP", # pyupgrade
    "B", # flake8-bugbear
    "SIM", # flake8-simplify
    "I", # isorthttps://chatgpt.com/g/g-p-6979c33cc7288191bcddefd220091a44-arkhitektura/project
    "C", # flake8-comprehensions
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"
multiline-quotes = "double"

[tool.pytest.ini_options]
pythonpath = ["scr"]

[tool.djlint]
indent = 4
max_line_length = 120
profile = "django"